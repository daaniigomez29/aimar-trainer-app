name: CI y despliegue

on:
  pull_request:
  push:
    branches: [main, develop, dev]

concurrency:
  group: ci-${{ github.ref }}
  # Solo se cancela lo de los PR, donde sobra gastar minutos en una version
  # vieja. En un push a `dev` o `main` NO se cancela: cortar un `db push` a
  # medias dejaria el esquema del proyecto en un estado que nadie ha probado.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flutter:
    name: Análisis y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # El código generado (freezed / json_serializable / riverpod) se versiona,
      # pero se regenera aquí para detectar que un .g.dart quedó desactualizado.
      - name: Generar código
        run: dart run build_runner build

      - name: Comprobar que el código generado está al día
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::Hay código generado sin comitear. Ejecuta 'dart run build_runner build' y añade los cambios."
            git status --porcelain
            git diff
            exit 1
          fi

      - name: Comprobar formato
        run: dart format --output=none --set-exit-if-changed .

      # `dart analyze`, no `flutter analyze`: riverpod_lint 3.x se declara en el
      # bloque `plugins:` de analysis_options.yaml (sistema `analysis_server_plugin`)
      # y solo `dart analyze` carga esos plugins. Con `flutter analyze` el proyecto
      # sale limpio pero las reglas de Riverpod no se evaluan.
      # `--fatal-infos` porque varias de esas reglas se reportan como `info` y sin
      # la flag no cambiarian el codigo de salida.
      - name: Analizar
        run: dart analyze --fatal-infos

      - name: Tests
        run: flutter test

  edge-functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Comprobar formato
        run: deno fmt --check supabase/functions

      - name: Lint
        run: deno lint supabase/functions

      # El import map vive en supabase/functions/deno.json, no en la raiz, asi
      # que hay que pasarlo explicitamente.
      #
      # Las TRES funciones: `enviar-recordatorios` se quedo fuera cuando se
      # anadio en la fase 6, asi que su codigo no pasaba por aqui.
      - name: Comprobar tipos
        run: >
          deno check --config supabase/functions/deno.json
          supabase/functions/crear-cliente/index.ts
          supabase/functions/dar-de-baja-cliente/index.ts
          supabase/functions/enviar-recordatorios/index.ts

  # ---------------------------------------------------------------------------
  # Despliegue a Supabase
  # ---------------------------------------------------------------------------
  #
  # Qué hace: aplicar las migraciones pendientes y publicar las Edge Functions
  # del proyecto que corresponda a la rama.
  #
  # Qué NO hace, a propósito:
  #   - La web. La despliega Vercel con su integración de GitHub, que ya hace
  #     build y preview por PR sin pasar por aquí.
  #   - Los secretos de las funciones (Resend, VAPID, SECRETO_CRON) ni los de
  #     Vault del job de recordatorios. Son valores, no código: se ponen una vez
  #     con `supabase secrets set` y no tienen por qué pasar por un log de CI.
  #   - El seed. `seed.sql` y `seed_demo.sql` son de local; aquí no se incluyen
  #     (`db push` solo los aplicaría con `--include-seed`, que no se usa).
  #
  # Secretos que espera, en el Environment que se llama **como la rama**
  # (Settings → Environments → `main`, y `dev` si algún día hay un segundo
  # proyecto):
  #   SUPABASE_ACCESS_TOKEN  Token personal de la cuenta (Account → Access Tokens)
  #   SUPABASE_PROJECT_REF   Ref del proyecto (el de la URL del panel)
  #   SUPABASE_DB_PASSWORD   Contraseña de Postgres de ese proyecto
  #
  # Mientras un entorno no tenga esos secretos, el job no falla: se salta solo y
  # lo deja dicho en el resumen. Así `dev` no se pone en rojo por un proyecto que
  # todavía no existe.
  #
  # OJO: este job y la integración de GitHub del panel de Supabase hacen lo
  # mismo. Si las dos están activas, cada push despliega dos veces. La
  # integración se desconecta en el panel del proyecto.
  desplegar:
    name: Desplegar a Supabase
    # Nada se despliega si el análisis, los tests o las funciones no pasan: es
    # justo lo que el pipeline existe para impedir.
    needs: [flutter, edge-functions]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # El entorno se llama como la rama y es quien decide a qué proyecto se
    # despliega, porque los secretos son suyos. A `main` se le pueden exigir
    # revisores desde Settings, y entonces el job espera aprobación.
    environment: ${{ github.ref_name }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # La lee la CLI al enlazar y al empujar, así no hay que pasarla por la
      # línea de órdenes (donde acabaría en el log).
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Fija, no `latest`: un cambio de la CLI no debe cambiar lo que se
          # aplica a la base sin que nadie lo haya decidido.
          version: 2.119.0

      - name: Comprobar que el entorno está configurado
        id: entorno
        env:
          REF_PROYECTO: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$REF_PROYECTO" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "listo=no" >> "$GITHUB_OUTPUT"
            echo "### Despliegue omitido" >> "$GITHUB_STEP_SUMMARY"
            echo "El entorno \`${{ github.ref_name }}\` no tiene configurados SUPABASE_PROJECT_REF y SUPABASE_ACCESS_TOKEN." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "listo=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Enlazar el proyecto
        if: steps.entorno.outputs.listo == 'si'
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Migraciones pendientes
        if: steps.entorno.outputs.listo == 'si'
        run: |
          supabase migration list --linked
          echo '### Migraciones que se van a aplicar' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          supabase db push --linked --dry-run 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Las migraciones son inmutables (trampa 7 de docs/estado-actual.md): aquí
      # solo se aplican las que faltan, nunca se reescribe una ya aplicada.
      - name: Aplicar migraciones
        if: steps.entorno.outputs.listo == 'si'
        run: supabase db push --linked

      # Sin nombres: despliega todas las carpetas de supabase/functions. La
      # configuración por función (verify_jwt de `enviar-recordatorios`) sale de
      # config.toml, así que no se repite aquí.
      # `--use-api` empaqueta en el servidor: no hace falta Docker en el runner.
      - name: Desplegar Edge Functions
        if: steps.entorno.outputs.listo == 'si'
        run: supabase functions deploy --use-api

