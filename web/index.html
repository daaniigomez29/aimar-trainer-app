<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Planificación de entrenamientos y seguimiento del progreso.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Aimar Trainer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Aimar Trainer</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    Puente con la API de push del navegador (CU-22).

    Vive aqui, en JavaScript, y no en Dart, porque `PushManager` solo existe en el
    navegador: la app lo llama con `dart:js_interop` desde `servicio_push_web.dart`,
    detras de la interfaz `ServicioPush`. Todo devuelve texto plano o JSON en
    cadena para que el puente sea lo mas simple posible.
  -->
  <script>
    window.aimarPush = {
      /** El navegador admite push? Safari en iOS solo con la PWA instalada. */
      soportado: function () {
        return "serviceWorker" in navigator &&
          "PushManager" in window &&
          "Notification" in window;
      },

      /** "default" (sin preguntar), "granted", "denied" o "no-soportado". */
      permiso: function () {
        if (!window.Notification) return "no-soportado";
        return Notification.permission;
      },

      /**
       * Registra el service worker del push. Ambito propio para no pisar el de
       * Flutter, que ocupa la raiz.
       */
      registro: async function () {
        return await navigator.serviceWorker.register("push_sw.js", {
          scope: "push/",
        });
      },

      /** Pide permiso y se suscribe. Devuelve la suscripcion en JSON, o null. */
      suscribir: async function (clavePublica) {
        if (!this.soportado()) return null;
        const permiso = await Notification.requestPermission();
        if (permiso !== "granted") return null;

        const registro = await this.registro();
        const suscripcion = await registro.pushManager.subscribe({
          // Obligatorio en Chrome: no admite push silencioso.
          userVisibleOnly: true,
          applicationServerKey: this._base64UrlABytes(clavePublica),
        });
        return JSON.stringify(suscripcion.toJSON());
      },

      /** La suscripcion ya existente de este dispositivo, o null. */
      suscripcionActual: async function () {
        if (!this.soportado()) return null;
        const registro = await navigator.serviceWorker.getRegistration("push/");
        if (!registro) return null;
        const suscripcion = await registro.pushManager.getSubscription();
        return suscripcion ? JSON.stringify(suscripcion.toJSON()) : null;
      },

      /** Cancela la suscripcion del navegador. Devuelve su endpoint, o null. */
      desuscribir: async function () {
        const registro = await navigator.serviceWorker.getRegistration("push/");
        if (!registro) return null;
        const suscripcion = await registro.pushManager.getSubscription();
        if (!suscripcion) return null;
        const endpoint = suscripcion.endpoint;
        await suscripcion.unsubscribe();
        return endpoint;
      },

      /** La clave VAPID viaja en base64url y `subscribe` la quiere en bytes. */
      _base64UrlABytes: function (valor) {
        const relleno = "=".repeat((4 - (valor.length % 4)) % 4);
        const base64 = (valor + relleno).replace(/-/g, "+").replace(/_/g, "/");
        const crudo = window.atob(base64);
        const bytes = new Uint8Array(crudo.length);
        for (let i = 0; i < crudo.length; i++) bytes[i] = crudo.charCodeAt(i);
        return bytes;
      },
    };
  </script>

  <!--
    Reproductor de video incrustado (ficha del ejercicio).

    Flutter web pinta sobre un canvas, asi que un iframe no se puede crear desde
    Dart: se registra como "vista de plataforma" y el motor lo coloca encima. Este
    factory es lo que devuelve el elemento; el widget que lo monta esta en
    `reproductor_video_web.dart`.
  -->
  <script>
    window.aimarVideo = {
      // Devuelve un contenedor con el iframe y, encima, el aviso de activacion.
      //
      // POR QUE EL AVISO VA AQUI Y NO EN FLUTTER: una vista de plataforma es un
      // elemento del DOM que el motor coloca SOBRE el lienzo, asi que un aviso
      // pintado por Flutter quedaba debajo del video y no se veia. El texto
      // llega desde Dart para no repartir los literales de la interfaz.
      crearIframe: function (url, aviso) {
        const caja = document.createElement("div");
        caja.style.position = "relative";
        caja.style.width = "100%";
        caja.style.height = "100%";
        // Tambien inerte: si el contenedor recibe el puntero, es el quien queda
        // bajo el dedo y no el lienzo de Flutter.
        caja.style.pointerEvents = "none";

        const marco = document.createElement("iframe");
        marco.src = url;
        marco.style.border = "0";
        marco.style.position = "absolute";
        marco.style.inset = "0";
        marco.style.width = "100%";
        marco.style.height = "100%";
        marco.setAttribute("loading", "lazy");
        marco.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
        marco.setAttribute("title", "Video de ejemplo del ejercicio");
        // Lo minimo para que el reproductor funcione: sin `fullscreen` el boton
        // de pantalla completa aparece pero no hace nada.
        marco.setAttribute(
          "allow",
          "accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen"
        );
        marco.allowFullscreen = true;
        // Inerte de entrada: un iframe se traga la rueda y el dedo, y el
        // usuario no entiende por que la pagina no baja cuando el puntero esta
        // encima del video. Flutter desplaza escuchando esos eventos, asi que
        // si el iframe se los queda, no hay scroll. Se activa al tocarlo.
        marco.style.pointerEvents = "none";

        const capa = document.createElement("div");
        capa.style.position = "absolute";
        capa.style.inset = "0";
        capa.style.display = "flex";
        capa.style.flexDirection = "column";
        capa.style.alignItems = "center";
        capa.style.justifyContent = "center";
        capa.style.gap = "8px";
        capa.style.background = "rgba(0, 0, 0, 0.45)";
        capa.style.color = "#fff";
        capa.style.font = "500 13px/1.3 system-ui, sans-serif";
        capa.style.textAlign = "center";
        capa.style.padding = "0 12px";
        // Tampoco recibe nada: el toque tiene que llegar a Flutter, que es
        // quien decide activar.
        capa.style.pointerEvents = "none";
        capa.innerHTML =
          '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" ' +
          'stroke="currentColor" stroke-width="1.5" aria-hidden="true">' +
          '<circle cx="12" cy="12" r="9"></circle>' +
          '<path d="M10 8.5l6 3.5-6 3.5z" fill="currentColor"></path></svg>';
        capa.appendChild(document.createTextNode(aviso));

        caja.appendChild(marco);
        caja.appendChild(capa);
        return caja;
      },

      // Devuelve el control al reproductor: a partir de aqui el video responde
      // a los clics (play, volumen, pantalla completa) y, como cualquier video
      // incrustado, se queda con la rueda mientras el puntero este encima.
      permitirInteraccion: function (caja) {
        caja.style.pointerEvents = "auto";
        caja.firstChild.style.pointerEvents = "auto";
        caja.lastChild.style.display = "none";
      },

      // Lo devuelve a inerte. El contenedor se reutiliza mientras dure la
      // sesion, asi que sin esto una ficha abierta por segunda vez saldria con
      // el video ya activo y el scroll volveria a no funcionar encima de el.
      bloquearInteraccion: function (caja) {
        caja.style.pointerEvents = "none";
        caja.firstChild.style.pointerEvents = "none";
        caja.lastChild.style.display = "flex";
      },
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
